services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: balance-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: balance-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    # LTS line, not an Innovation one. This container is local development only
    # (it is excluded from the deploy rsync in .github/workflows/deploy.yml), so
    # it does not have to track MySQL's quarterly CalVer releases.
    # 8.0 -> 8.4 is a supported upgrade and the 8.4 server upgrades the existing
    # `dbdata` volume on first start; the reverse is not supported, so going back
    # to 8.0 means restoring a dump.
    image: mysql:8.4
    container_name: balance-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: balance_daily
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
